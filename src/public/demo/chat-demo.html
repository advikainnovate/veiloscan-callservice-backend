<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Chat Demo — Communication Platform</title>
        <style>
            * { box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                margin: 0;
                padding: 28px 20px;
                background: #f0f4f8;
                color: #1a202c;
            }
            .page { max-width: 560px; margin: 0 auto; }
            h1 { font-size: 1.4rem; margin-bottom: 4px; }
            .back { font-size: 13px; color: #38a169; text-decoration: none; display: block; margin-bottom: 16px; }
            .card {
                background: #fff;
                border-radius: 12px;
                border: 1px solid #e2e8f0;
                padding: 24px;
                margin-bottom: 16px;
            }
            label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 4px; margin-top: 14px; }
            label:first-child { margin-top: 0; }
            input[type="text"], input[type="password"] {
                width: 100%;
                padding: 9px 12px;
                border: 1px solid #cbd5e0;
                border-radius: 7px;
                font-size: 14px;
                outline: none;
            }
            input:focus { border-color: #38a169; }
            button {
                padding: 9px 18px;
                border: none;
                border-radius: 7px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
            }
            #joinBtn { background: #38a169; color: #fff; margin-top: 14px; }
            #joinBtn:disabled { opacity: 0.45; cursor: not-allowed; }
            .status-bar {
                margin-top: 14px;
                padding: 9px 14px;
                border-radius: 7px;
                font-size: 13px;
                font-weight: 600;
                background: #edf2f7;
                color: #4a5568;
            }
            .status-bar.joined { background: #c6f6d5; color: #276749; }
            .status-bar.error  { background: #fed7d7; color: #9b2c2c; }

            /* message window */
            .messages {
                height: 280px;
                overflow-y: auto;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                padding: 12px;
                background: #f7fafc;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .msg {
                max-width: 80%;
                padding: 8px 12px;
                border-radius: 10px;
                font-size: 14px;
                line-height: 1.4;
                word-break: break-word;
            }
            .msg.me {
                align-self: flex-end;
                background: #38a169;
                color: #fff;
                border-bottom-right-radius: 3px;
            }
            .msg.them {
                align-self: flex-start;
                background: #e2e8f0;
                color: #1a202c;
                border-bottom-left-radius: 3px;
            }
            .msg.system {
                align-self: center;
                background: transparent;
                color: #718096;
                font-size: 12px;
                font-style: italic;
            }
            .typing-indicator {
                font-size: 12px;
                color: #718096;
                font-style: italic;
                min-height: 18px;
                padding: 2px 4px;
            }
            .compose {
                display: flex;
                gap: 8px;
                margin-top: 10px;
            }
            .compose input {
                flex: 1;
                padding: 9px 12px;
                border: 1px solid #cbd5e0;
                border-radius: 7px;
                font-size: 14px;
                outline: none;
            }
            .compose input:focus { border-color: #38a169; }
            #sendBtn {
                background: #38a169;
                color: #fff;
                padding: 9px 18px;
                border-radius: 7px;
                border: none;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
            }
            #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }
        </style>
    </head>
    <body>
        <div class="page">
            <a class="back" href="/public/demos.html">← Back to demos</a>
            <h1>Chat Demo</h1>

            <div class="card">
                <label>API Key</label>
                <input id="apiKey" type="password" placeholder="cp_live_..." />

                <label>Room ID</label>
                <input id="roomId" type="text" placeholder="e.g. demo-room-1" />

                <label>Your User ID <span style="font-weight:400;color:#718096">(optional)</span></label>
                <input id="userId" type="text" placeholder="auto-generated if empty" />

                <button id="joinBtn">Join Room</button>
                <div class="status-bar" id="statusBar">Status: idle</div>
            </div>

            <div class="card">
                <div class="messages" id="messages"></div>
                <div class="typing-indicator" id="typingIndicator"></div>
                <div class="compose">
                    <input id="messageInput" type="text" placeholder="Type a message…" disabled />
                    <button id="sendBtn" disabled>Send</button>
                </div>
            </div>

            <div class="card" style="color:#4a5568;font-size:13px;line-height:1.7">
                <strong>How to demo:</strong>
                <ol style="margin:8px 0 0;padding-left:18px">
                    <li>Open this page in <strong>two browser tabs</strong></li>
                    <li>Paste the same <strong>API Key</strong> and <strong>Room ID</strong> in both</li>
                    <li>Click <strong>Join Room</strong> in both tabs</li>
                    <li>Send messages — they appear in real time in the other tab</li>
                </ol>
            </div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script type="module" src="/public/demo/chat-demo.js"></script>
    </body>
</html>
