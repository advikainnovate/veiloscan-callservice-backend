<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call SDK Integration Test</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='16'%3E📞%3C/text%3E%3C/svg%3E">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f7f9fc; color: #111; }
    h1 { margin-bottom: 0.2em; }
    .panel { background: #fff; border: 1px solid #d7dde8; border-radius: 10px; padding: 18px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    label, button { display: block; margin: 8px 0; }
    input, textarea { width: 100%; font-family: inherit; font-size: 14px; box-sizing: border-box; }
    input { padding: 8px; border: 1px solid #d7dde8; border-radius: 6px; }
    textarea { min-height: 200px; margin-top: 14px; padding: 12px; border-radius: 8px; border: 1px solid #d7dde8; background: #fbfcfd; }
    button { padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; background: #0066ff; color: white; transition: background 0.2s ease; font-weight: 500; }
    button:hover { background: #0053d4; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .note { font-size: 0.95rem; color: #666; margin-top: 12px; line-height: 1.5; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; background: #e2e8f0; color: #102a43; font-size: 0.85rem; font-weight: 600; }
    .status { padding: 12px; border-radius: 6px; margin-top: 10px; font-size: 0.95rem; }
    .status.connected { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    audio { margin-top: 10px; width: 100%; border-radius: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="panel">
    <h1>📞 Call SDK Integration Test</h1>
    <p class="note">
      This page demonstrates how to integrate the Calls SDK. Open in two tabs with different user IDs to test calling between peers.
      The SDK handles all WebRTC signaling through Socket.IO.
    </p>
  </div>

  <div class="panel">
    <h2>Configuration</h2>
    <div class="grid-2">
      <label>
        Your User ID:
        <input id="userId" placeholder="e.g., user-001" value="user-001" />
      </label>
      <label>
        Socket Server URL:
        <input id="socketUrl" placeholder="ws://localhost:4000" value="ws://localhost:4000" />
      </label>
    </div>
    <label>
      Target User ID (to call):
      <input id="targetUserId" placeholder="e.g., user-002" />
    </label>
    <div class="row">
      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="panel">
    <h2>Call Actions</h2>
    <div class="row">
      <button id="callBtn" disabled>Initiate Call</button>
      <button id="acceptBtn" disabled>Accept Call</button>
      <button id="rejectBtn" disabled>Reject Call</button>
      <button id="hangupBtn" disabled>End Call</button>
    </div>
  </div>

  <div class="panel">
    <h2>Media</h2>
    <div class="row">
      <button id="startMicBtn" disabled>Start Mic</button>
      <button id="stopMicBtn" disabled>Stop Mic</button>
    </div>
    <h3>Remote Audio</h3>
    <audio id="remoteAudio" autoplay playsinline controls></audio>
  </div>

  <div class="panel">
    <h2>Log</h2>
    <textarea id="log" readonly></textarea>
  </div>

  <!-- Import the SDK modules using type=module for ES6 -->
  <script type="module" src="test-webrtc-sdk.js"></script>
</body>
</html>
